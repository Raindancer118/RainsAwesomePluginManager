name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # A newer push to the same ref makes an in-flight run pointless, and two runs
  # racing to replace the rolling "latest" release would be a coin flip.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Java 25: paper-api 26.x targets class file version 69, so an older JDK
      # cannot even read the API jar.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v4

      # Read straight out of build.gradle.kts rather than asking Gradle to evaluate it: cheaper,
      # and every other step here only needs the string, not a live project model.
      - name: Read the project version
        id: version
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)"
          [ -n "$VERSION" ] || { echo "::error::could not read version from build.gradle.kts"; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building APM $VERSION"

      # Whether this version already has a tag on the remote — the switch that lets a plain
      # version bump on main publish on its own, instead of silently building a jar nobody can
      # install as a fixed version until somebody remembers to push a matching tag by hand.
      - name: Check whether vVERSION is already tagged
        id: tagcheck
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}" \
              >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and test
        run: ./gradlew build --no-daemon

      # Runs even on failure: a red build is exactly when the report matters.
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test/
          retention-days: 14
          if-no-files-found: ignore

      - name: Locate jar
        id: jar
        run: echo "path=$(ls build/libs/apm-*.jar | head -n1)" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: apm
          path: ${{ steps.jar.outputs.path }}

      # Every push to main republishes a rolling "latest" release, so there is
      # always one stable download link for a server admin — no need to hunt
      # through commits for day-to-day updates.
      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "${{ steps.jar.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --title "Latest build" \
            --notes "Automatic build from main @ ${{ github.sha }}. Drop the jar into your server's plugins/ folder and restart." \
            --prerelease

      # A pushed vX.Y.Z tag cuts a proper, permanent release — or, when a plain push to main bumps
      # build.gradle.kts to a version nobody has tagged yet, this cuts and tags it on its own.
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tagcheck.outputs.new == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
        run: |
          gh release create "$TAG" "${{ steps.jar.outputs.path }}" \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --generate-notes

      # Tagged only now that the release above has actually succeeded — not before it, so a failed
      # release leaves no tag behind and gets retried on the next push instead of being silently
      # marked done. A tag pushed here with the default GITHUB_TOKEN does not retrigger this
      # workflow (GitHub's own recursion guard), which is why the release runs in *this* job rather
      # than waiting for that retrigger.
      - name: Tag this version
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.tagcheck.outputs.new == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
