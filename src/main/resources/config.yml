# Rain's Awesome Plugin Manager
#
# Everything here can be reloaded at runtime with /apm reloadconfig or from the main menu.

security:
  # Refuse plain HTTP downloads. A plugin jar fetched over HTTP can be swapped in transit by
  # anything between your server and the source, and it is executed with full server privileges.
  # Turn this off only for a source on your own LAN.
  require-https: true

  # Hosts APM is allowed to download from. An empty list means "any host", which is the default:
  # only operators can run /apm install in the first place.
  # Subdomains are matched, so "modrinth.com" also allows "cdn.modrinth.com".
  # Example of a locked-down setup:
  #   allowed-hosts:
  #     - modrinth.com
  #     - github.com
  #     - githubusercontent.com
  allowed-hosts: []

  # Hard cap per download, in megabytes. Enforced while streaming, not just against the
  # Content-Length header a remote server claims.
  max-download-size-mb: 200

download:
  connect-timeout-seconds: 15
  read-timeout-seconds: 120

  # Keep verified downloads in plugins/APM/cache/ after installing them. Useful if you want to
  # archive exactly what was deployed; costs disk space.
  keep-cache: false

install:
  # Install plugins whose declared api-version is newer than this server.
  # Leave this off: such a plugin will usually fail to load, and when it does load it tends to
  # break in ways that are hard to trace back. APM asks for confirmation per install instead.
  allow-incompatible: false

  # Try to load a newly installed plugin without a restart. Paper makes no promise that this
  # works; when it does not, APM says so and the plugin comes up on the next start.
  # Updates never hot-load — the old classes are still resident.
  #
  # Be aware of the cost: loading and enabling a plugin is main-thread work, so the server stops
  # ticking for as long as the plugin takes to start. A heavyweight plugin opening a database can
  # take several seconds, and Paper's watchdog will print a thread dump about it — expected here,
  # not a crash. On a busy production server, turn this off and install during a planned restart.
  attempt-hot-load: true

restart:
  # Seconds between "/apm restart" and the actual restart, so players get a warning.
  # Set to 0 to restart immediately.
  countdown-seconds: 10

  # How a restart actually happens is not configurable, because it is not a preference — it depends
  # on how your server is run, and APM detects it:
  #
  #   * Supervised (recommended). Something outside the JVM starts the server again when it exits:
  #     APM's own generated script (/apm restartscript create), a systemd unit with Restart=, or a
  #     Pterodactyl/Wings container. APM then simply stops the server and lets the supervisor bring
  #     it back. Reliable.
  #     - With systemd, set APM_SUPERVISED=1 in the unit's Environment= so APM knows.
  #
  #   * Paper's restart-script. Without a supervisor, APM falls back to Server#restart(), which
  #     execs settings.restart-script from spigot.yml as a CHILD of the dying JVM. In a screen or
  #     tmux session that child usually gets killed with the session, and the server stays down.
  #     If the script is missing entirely, Paper just shuts down.
  #
  # Run /apm restartscript to see which case you are in.

modrinth:
  # Which loader to ask Modrinth for. "paper" is right for a Paper server; "folia", "spigot" and
  # "bukkit" also work if you specifically want builds tagged for those.
  loader: paper
